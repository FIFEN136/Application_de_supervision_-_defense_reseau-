name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: Bibliothèques système (Linux, Qt hors écran)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests (toute la suite)
        run: python -m pytest -q
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: python -m pip install -r requirements-dev.txt
      - name: Analyse statique (ruff)
        run: ruff check .
      - name: Analyse de sécurité du code (bandit)
        run: bandit -r core database ui utils agent main.py -ll -q
      - name: Vulnérabilités des dépendances
        run: pip-audit -r requirements.txt
      - name: SBOM
        run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
  package-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm --windowed --name ProcusSecure main.py
      # Signature : définir les secrets CODESIGN_PFX (base64) et CODESIGN_PASSWORD, puis signtool sign /fd SHA256 /tr <horodatage> ...
      - uses: actions/upload-artifact@v4
        with: { name: ProcusSecure-windows, path: dist/ProcusSecure }
